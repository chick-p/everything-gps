name: Run test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ./.node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
        env:
          CI: true

      - name: Edit wrangler.toml (web)
        working-directory: apps/web
        run: |
          mv ./wrangler.toml.sample ./wrangler.toml

      - name: Migrate database
        working-directory: apps/web
        run: |
          npx drizzle-kit generate
          npx wrangler d1 migrations apply everything-gps-database --local
          npx wrangler d1 execute everything-gps-database \
            --command="INSERT INTO Locations (name, lat, lng) VALUES ('Himeji Castle', '34.8394324', '134.693894')" \
            --local

      - name: Run test
        working-directory: apps/web
        run: pnpm test
